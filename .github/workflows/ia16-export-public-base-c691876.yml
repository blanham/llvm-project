name: IA-16 export public base c691876

on:
  push:
    branches:
      - automation/ia16-public-base-export-c691876
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact public base
        uses: actions/checkout@v4
        with:
          ref: c69187622fdf5f8516b75aa5321e510ae45c8e53
          fetch-depth: 1

      - name: Verify and archive
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = c69187622fdf5f8516b75aa5321e510ae45c8e53
          git archive --format=tar --prefix=llvm-project-c691876/ HEAD \
            | zstd -T0 -10 -o llvm-project-c691876.tar.zst
          sha256sum llvm-project-c691876.tar.zst > llvm-project-c691876.tar.zst.sha256
          du -h llvm-project-c691876.tar.zst

      - name: Upload exact source archive
        uses: actions/upload-artifact@v4
        with:
          name: llvm-project-public-base-c691876
          path: |
            llvm-project-c691876.tar.zst
            llvm-project-c691876.tar.zst.sha256
          compression-level: 0
          retention-days: 30
